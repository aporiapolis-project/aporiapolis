# Config machine pour la source OWID CO2 emissions
# (Our World in Data — owid/co2-data, dataset CO2 et autres GES).
#
# Cette config est la source of truth pour :
#   - l'URL canonique du téléchargement
#   - la licence à afficher dans les exports / pages
#   - les SLOs HTTP (timeout, retry) machine-only
#   - expected_source_header : liste ORDONNÉE COMPLÈTE des colonnes
#     du CSV OWID (fail-fast sur drift exact dans l'asset bronze)
#
# IMPORTANT — figeage Mission 0 B-8.2 :
# La liste `expected_source_header` ci-dessous est un POINT DE DÉPART
# basé sur le codebook OWID publiquement documenté à la date du
# 18 mai 2026. L'agent qui exécute B-8.2 DOIT en Mission 0 télécharger
# le CSV via `curl -fsSL "$OWID_URL" | head -n 1`, comparer header
# par header avec cette liste, et SUBSTITUER la liste réelle si
# divergence (colonnes ajoutées par OWID après mai 2026). Le test
# `test_owid_header_contract.py` (cas c) vérifie aussi l'alignement
# migration 002 SQL ↔ ce YAML.
#
# La source card humaine `docs/sources/owid.md` est lisible par
# l'humain (URL, licence, fraîcheur observée, colonnes utiles
# silver) ; ce YAML est lisible par la machine (contrat strict).
# Le test `test_sources_consistency.py` vérifie que les champs
# publics communs (URL, licence) sont alignés entre les deux.

source: owid
entity: co2_emissions

# URL canonique du CSV OWID. Cette URL est aussi présente dans
# docs/sources/owid.md (source card humaine) — test cohérence vérifie
# l'alignement.
url: https://github.com/owid/co2-data/raw/master/owid-co2-data.csv

# Licence telle que publiée par OWID. Doit être identique à
# docs/sources/owid.md.
licence: CC BY 4.0

# Fraîcheur observée (mise à jour OWID). Machine-only (pas dans
# source card car la source card observe la fraîcheur réelle au
# moment de la rédaction B-8.0, qui peut diverger).
freshness:
  cadence: annual
  typical_lag_days: 60

# SLOs HTTP pour le download bronze. Machine-only — pas dans
# source card. Ces paramètres sont des contrats d'implémentation,
# pas des contrats de la source.
http:
  timeout_seconds: 30
  retry:
    total: 3
    backoff_factor: 1.0
    status_forcelist:
      - 500
      - 502
      - 503
      - 504

# Header CSV ordonné complet — figé en Mission 0 B-8.2.
# Cette liste DOIT être strictement identique au header CSV
# téléchargé. L'asset bronze fail-fast sur drift exact (manquant
# OU ajouté).
#
# Source : codebook OWID owid/co2-data publié 2024-2025
# (https://github.com/owid/co2-data/blob/master/owid-co2-codebook.csv).
# À VÉRIFIER ET CORRIGER PAR L'AGENT EN MISSION 0.
